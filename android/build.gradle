plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

def packageJson = new groovy.json.JsonSlurper().parse(file('../package.json'))
// ReceptionExpoMessagingService takes Reception's replies out of expo-notifications' delivery. When Node resolves
// expo-notifications from the project (the config plugin's condition too), it is compiled and declared, against
// expo-notifications as the app links it: its Gradle project, or the prebuilt publication (Expo 57+).
def expoNotifications = findExpoNotifications()

def findExpoNotifications() {
  def resolved = providers.exec {
    workingDir rootDir
    commandLine 'node', '--print', "try { require.resolve('expo-notifications/package.json') } catch { '' }"
  }.standardOutput.asText.get().trim()
  if (resolved.isEmpty()) return null
  def project = findProject(':expo-notifications')
  if (project != null) return project
  def config = new File(new File(resolved).parentFile, 'expo-module.config.json')
  def publication = config.exists() ? new groovy.json.JsonSlurper().parse(config).android?.publication : null
  if (publication == null) {
    throw new GradleException('Reception: expo-notifications is installed but not linked; run npx expo prebuild.')
  }
  return "${publication.groupId}:${publication.artifactId}:${publication.version}"
}

group = 'sh.reception'
version = packageJson.version

android {
  namespace 'sh.reception.reactnative'
  defaultConfig {
    versionCode 1
    versionName packageJson.version
  }
  sourceSets {
    main {
      if (expoNotifications != null) {
        java.srcDirs += 'src/expoNotifications/java'
        manifest.srcFile 'src/expoNotifications/AndroidManifest.xml'
      }
    }
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  // Reception Android SDK from Maven Central; it brings Compose, coroutines and its consumer R8 rules.
  implementation 'sh.reception:reception:1.0.0'
  // ReactFontManager: appearance.fontFamily uses the fonts React Native knows.
  implementation 'com.facebook.react:react-android'

  if (expoNotifications != null) {
    // Both come from the app at runtime: expo-notifications and the Firebase Messaging it brings.
    compileOnly expoNotifications
    compileOnly 'com.google.firebase:firebase-messaging:24.1.0'
  }

  testImplementation 'junit:junit:4.13.2'
  // The real org.json; Android's is a stub in JVM unit tests.
  testImplementation 'org.json:json:20231013'
  testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
}
