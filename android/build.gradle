plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

def packageJson = new groovy.json.JsonSlurper().parse(file('../package.json'))
// Which FCM messaging service receives Reception's replies, decided by messaging-service.js, the rule the config plugin
// uses too, from Expo's resolved autolinking (the `expoGradle` extension its settings plugin registers), so an
// excluded expo-notifications counts as absent. 'expo': ReceptionExpoMessagingService is compiled and declared, against
// expo-notifications as autolinking links it: its Gradle project, or the prebuilt publication (Expo 57+). 'none'
// (React Native Firebase) and 'sdk' build neither.
def linkedExpoNotifications = findLinkedExpoNotifications()
def expoNotifications =
  selectMessagingService(linkedExpoNotifications != null) == 'expo' ? linkedExpoNotifications : null

def findLinkedExpoNotifications() {
  def expoGradle = gradle.extensions.findByName('expoGradle')
  def linked = expoGradle?.config?.allProjects?.find { it.name == 'expo-notifications' }
  if (linked?.usePublication) {
    def publication = linked.publication
    return "${publication.groupId}:${publication.artifactId}:${publication.version}"
  }
  // Built from source; also without Expo's settings plugin (React Native community autolinking).
  return findProject(':expo-notifications')
}

def selectMessagingService(boolean expoNotificationsLinked) {
  def projectRoot = gradle.extensions.findByName('expoGradle')?.projectRoot ?: rootDir.parentFile
  def output = providers.exec {
    workingDir rootDir
    commandLine 'node', file('messaging-service.js').absolutePath, projectRoot.absolutePath,
      "${expoNotificationsLinked}"
  }.standardOutput.asText.get()
  def selection = new groovy.json.JsonSlurper().parseText(output)
  if (selection.warning) logger.warn("Reception: ${selection.warning}")
  return selection.service
}

group = 'sh.reception'
version = packageJson.version

android {
  namespace 'sh.reception.reactnative'
  defaultConfig {
    versionCode 1
    versionName packageJson.version
  }
  sourceSets {
    main {
      if (expoNotifications != null) {
        java.srcDirs += 'src/expoNotifications/java'
        manifest.srcFile 'src/expoNotifications/AndroidManifest.xml'
      }
    }
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  // Reception Android SDK from Maven Central; it brings Compose, coroutines and its consumer R8 rules. `api` so the app
  // compiles against it too: React Native Firebase hosts call Reception.handlePushMessage from their own service.
  api 'sh.reception:reception:1.0.0'
  // ReactFontManager: appearance.fontFamily uses the fonts React Native knows.
  implementation 'com.facebook.react:react-android'

  if (expoNotifications != null) {
    // Both come from the app at runtime: expo-notifications and the Firebase Messaging it brings.
    compileOnly expoNotifications
    compileOnly 'com.google.firebase:firebase-messaging:24.1.0'
  }

  testImplementation 'junit:junit:4.13.2'
  // The real org.json; Android's is a stub in JVM unit tests.
  testImplementation 'org.json:json:20231013'
  testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
}
